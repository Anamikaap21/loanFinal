version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: realcred-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: realcred
    volumes:
      - mongo_data:/data/db
    networks:
      - realcred-network

  # RealCred Full Stack App Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realcred-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/realcred
      JWT_SECRET: realcred_production_secure_jwt_secret_key_2026_live
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: https://realcred.in
      NODE_ENV: production
      INITIAL_ADMIN_EMAIL: admin@realcred.in
      INITIAL_ADMIN_PASSWORD: Admin@RealCred2026!
      INITIAL_ADMIN_NAME: RealCred Super Admin
      INITIAL_ADMIN_PHONE: 7048976349
    volumes:
      - app_uploads:/app/backend/uploads
    depends_on:
      - mongodb
    networks:
      - realcred-network

networks:
  realcred-network:
    driver: bridge

volumes:
  mongo_data:
  app_uploads:
